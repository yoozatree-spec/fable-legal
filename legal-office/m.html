<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile layout check</title>
<style>
  html,body{margin:0;background:#111;font-family:system-ui,sans-serif;color:#888}
  .wrap{display:flex;gap:20px;padding:16px;align-items:flex-start}
  .phone{width:390px;height:844px;border:10px solid #333;border-radius:32px;overflow:hidden;background:#070d18;flex:0 0 auto}
  iframe{width:390px;height:844px;border:0;display:block}
  p{font-size:12px}
</style></head>
<body>
<div class="wrap">
  <div>
    <p>390 × 844 (iPhone 14)</p>
    <div class="phone"><iframe id="a" title="mobile 390"></iframe></div>
  </div>
  <div>
    <p>320 × 700 (SE)</p>
    <div class="phone" style="width:320px;height:700px"><iframe id="b" title="mobile 320" style="width:320px;height:700px"></iframe></div>
  </div>
</div>
<script>
  var v = new URLSearchParams(location.search).get('v') || Date.now();
  document.getElementById('a').src = './index.html?v=' + v;
  document.getElementById('b').src = './index.html?v=' + v;
</script>
</body></html>

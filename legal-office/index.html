<title>🏛️ AI 법률팀 워크스페이스</title>
<style>
  :root{
    --bg:#070d18; --panel:#0f1b2d; --panel-2:#132238; --line:#1e3050;
    --gold:#e3c377; --gold-2:#b9924a;
    --text:#e9eef7; --text-2:#c3d0e2; --muted:#8ba0bd; --muted-2:#6b7f9c;
    --danger:#ec7488;
    --font:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    font-family:var(--font);color:var(--text);letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 520px at 78% -10%,rgba(227,195,119,.13),transparent 62%),
      radial-gradient(760px 440px at 6% 8%,rgba(46,196,160,.09),transparent 58%),
      var(--bg);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(600px 600px at 50% 30%,#000,transparent 78%);
            mask-image:radial-gradient(600px 600px at 50% 30%,#000,transparent 78%);
  }
  .card{
    position:relative;width:100%;max-width:392px;
    padding:34px 26px 26px;border-radius:22px;
    background:linear-gradient(180deg,rgba(19,34,56,.92),rgba(12,22,38,.96));
    border:1px solid var(--line);
    box-shadow:0 30px 70px -34px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.045);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .card::after{
    content:"";position:absolute;left:26px;right:26px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(227,195,119,.55),transparent);
  }
  .seal{
    width:62px;height:62px;margin:0 auto 16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    background:radial-gradient(circle at 30% 25%,rgba(227,195,119,.30),rgba(227,195,119,.06) 70%);
    border:1px solid rgba(227,195,119,.42);
    box-shadow:0 0 0 6px rgba(227,195,119,.05),0 10px 26px -14px rgba(227,195,119,.7);
  }
  h1{
    margin:0;text-align:center;font-size:20px;line-height:1.4;font-weight:700;
    letter-spacing:-.02em;
  }
  .sub{
    margin:8px 0 0;text-align:center;font-size:13px;line-height:1.6;color:var(--muted);
  }
  .lock-note{
    margin:18px 0 20px;padding:10px 12px;border-radius:11px;
    background:rgba(46,196,160,.07);border:1px solid rgba(46,196,160,.20);
    font-size:11.5px;line-height:1.55;color:#9fd8c7;text-align:center;
  }
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;margin:0 0 7px 2px}
  .field{position:relative}
  input[type=password],input[type=text]{
    width:100%;height:54px;padding:0 46px 0 15px;border-radius:13px;
    background:#0a1626;border:1px solid var(--line);
    color:var(--text);font-size:16px;letter-spacing:.02em;
    -webkit-appearance:none;appearance:none;outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  input::placeholder{color:#5d718c;letter-spacing:0}
  input:focus{border-color:rgba(227,195,119,.62);box-shadow:0 0 0 3px rgba(227,195,119,.13)}
  .eye{
    position:absolute;right:6px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);
    width:42px;height:42px;border:0;border-radius:10px;background:transparent;
    color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .eye:active{background:rgba(255,255,255,.06)}
  button.go{
    width:100%;height:54px;margin-top:14px;border:0;border-radius:13px;
    background:linear-gradient(180deg,#eed49a,#d3ac61);color:#241a08;
    font-size:15.5px;font-weight:800;letter-spacing:-.01em;
    box-shadow:0 14px 30px -16px rgba(227,195,119,.85);
    -webkit-tap-highlight-color:transparent;transition:transform .08s,filter .16s;
  }
  button.go:active{transform:translateY(1px);filter:brightness(.96)}
  button.go[disabled]{opacity:.72;filter:saturate(.5)}
  .msg{
    min-height:20px;margin:12px 2px 0;font-size:12.5px;line-height:1.5;color:var(--danger);
    text-align:center;
  }
  .msg.info{color:var(--muted)}
  .spin{
    display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;
    border:2px solid rgba(36,26,8,.28);border-top-color:#241a08;border-radius:50%;
    -webkit-animation:spin .7s linear infinite;animation:spin .7s linear infinite;
  }
  @-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{
    margin-top:20px;padding-top:14px;border-top:1px solid rgba(30,48,80,.7);
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:10.5px;color:var(--muted-2);letter-spacing:.02em;
  }
  .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);opacity:.6}
  @media (prefers-reduced-motion:reduce){.spin{-webkit-animation:none;animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="seal" aria-hidden="true">🏛️</div>
  <h1>AI 법률팀 워크스페이스</h1>
  <p class="sub">사건 정리 · 판례 · 손해액 · 서면 초안<br>비밀번호를 입력하면 워크스페이스가 열립니다.</p>

  <div class="lock-note">🔒 문서 전체가 <b>AES-256-GCM</b>으로 암호화되어 보관됩니다.<br>비밀번호는 서버로 전송되지 않고 이 기기에서만 복호화됩니다.</div>

  <form id="form" autocomplete="off" novalidate>
    <label for="pw">비밀번호</label>
    <div class="field">
      <input id="pw" name="pw" type="password" inputmode="text"
             autocomplete="current-password" autocapitalize="off" autocorrect="off"
             spellcheck="false" enterkeyhint="go" placeholder="비밀번호 입력" aria-describedby="msg">
      <button class="eye" id="eye" type="button" aria-label="비밀번호 보기">👁</button>
    </div>
    <button class="go" id="go" type="submit">잠금 해제</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="foot"><span>PBKDF2-SHA256 · 150000회</span><span class="dot"></span><span>AES-256-GCM</span><span class="dot"></span><span>noindex</span></div>
</main>

<noscript>
  <p style="position:fixed;inset:auto 0 20px;text-align:center;color:#c3d0e2;font-size:13px">
    이 페이지는 JavaScript가 필요합니다. Safari 설정에서 JavaScript를 켜 주세요.
  </p>
</noscript>

<script>
(function () {
  "use strict";

  var SALT_B64 = "sAaku24FJUS7ee4+JEOKOg==";
  var IV_B64   = "FOJ74OV+t2MeRkJR";
  var ITER     = 150000;

  var form = document.getElementById("form");
  var input = document.getElementById("pw");
  var goBtn = document.getElementById("go");
  var eye   = document.getElementById("eye");
  var msg   = document.getElementById("msg");
  var busy  = false;

  function b64ToBytes(b64) {
    var bin = atob(b64.replace(/\s+/g, ""));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function say(text, kind) {
    msg.textContent = text || "";
    msg.className = "msg" + (kind === "info" ? " info" : "");
  }

  eye.addEventListener("click", function () {
    var showing = input.type === "text";
    input.type = showing ? "password" : "text";
    eye.style.color = showing ? "" : "#e3c377";
    eye.setAttribute("aria-label", showing ? "비밀번호 보기" : "비밀번호 숨기기");
    input.focus({ preventScroll: true });
  });

  async function unlock(password) {
    var enc = new TextEncoder();
    var subtle = window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle);
    if (!subtle || !window.isSecureContext) {
      throw new Error("NO_CRYPTO");
    }
    var baseKey = await subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITER, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plain = await subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(IV_B64), tagLength: 128 },
      key,
      b64ToBytes(document.getElementById("enc-payload").textContent)
    );
    return new TextDecoder("utf-8").decode(plain);
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (busy) return;
    var pw = input.value;
    if (!pw) {
      say("비밀번호를 입력해 주세요.");
      input.focus({ preventScroll: true });
      return;
    }
    busy = true;
    goBtn.disabled = true;
    say('');
    goBtn.innerHTML = '<span class="spin"></span>복호화 중…';

    var html;
    try {
      html = await unlock(pw);
    } catch (err) {
      busy = false;
      goBtn.disabled = false;
      goBtn.textContent = "잠금 해제";
      if (err && err.message === "NO_CRYPTO") {
        say("이 브라우저에서는 복호화를 지원하지 않습니다. 최신 Safari로 열어 주세요.");
      } else {
        say("비밀번호가 맞지 않습니다. 다시 확인해 주세요.");
        input.select();
      }
      return;
    }

    // Same-origin full-document load so the workspace's localStorage keeps working.
    input.value = "";
    say("열리는 중…", "info");
    try {
      var doc = document;
      doc.open();
      doc.write(html);
      doc.close();
    } catch (err2) {
      busy = false;
      goBtn.disabled = false;
      goBtn.textContent = "잠금 해제";
      say("화면을 여는 중 문제가 생겼습니다. 새로고침 후 다시 시도해 주세요.");
    }
  });

  window.addEventListener("pageshow", function () {
    if (!busy) {
      busy = false;
      goBtn.disabled = false;
      goBtn.textContent = "잠금 해제";
    }
  });
})();
</script>
